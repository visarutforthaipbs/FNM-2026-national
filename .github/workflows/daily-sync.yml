name: Daily Factory Data Sync

on:
  # Schedule disabled 2026-08-08: the backend moved off Supabase cloud to the
  # self-hosted instance on lsev01, and the nightly sync now runs there via the
  # systemd timer `factory-sync.timer` (server/sync/run_nightly.sh), talking to
  # the database over loopback instead of the public internet.
  #
  # Leaving this scheduled would point a second pipeline at the now-unused cloud
  # project and race the on-prem one for the same client/public/data/ files.
  # Re-enabling requires repointing the SUPABASE_URL / SUPABASE_SERVICE_KEY
  # secrets at the new backend first.
  workflow_dispatch: # Manual trigger only

jobs:
  sync:
    runs-on: ubuntu-latest
    # Full pipeline (5 endpoints + 2 exports) never completed in 30min — every
    # run for weeks was cancelled mid-sync, before it ever reached the export
    # / git-commit steps. See commit history around 2026-08-08 for the postmortem.
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: server/sync/requirements.txt

      - name: Install dependencies
        run: pip install -r server/sync/requirements.txt

      - name: Run sync pipeline
        working-directory: server/sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python pipeline.py

      - name: Export markers JSON
        working-directory: server/sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python export_markers.py

      # Zoning is a function of position, so it must be rebuilt whenever the
      # markers move — including after an admin repositions a factory in
      # /admin. Skipping this leaves a moved factory showing the zone of where
      # it used to be. Needs dpt_geodatabase.db, which is gitignored for size,
      # so this is a no-op on a runner that does not have it.
      - name: Export DPT zoning JSON
        working-directory: server/sync
        run: |
          if [ -f ../data/dpt_geodatabase.db ]; then
            python export_zoning.py
          else
            echo "dpt_geodatabase.db not present — skipping zoning export"
            python export_zoning.py --check || \
              echo "::warning::zoning data is stale relative to markers; re-run export_zoning.py locally"
          fi

      - name: Export dashboard stats JSON
        working-directory: server/sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python export_dashboard.py

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add client/public/data/markers/ client/public/data/province-counts.json client/public/data/dashboard_stats.json
          if git diff --cached --quiet; then
            echo "No data changes detected, skipping commit."
          else
            git commit -m "chore: daily factory data sync $(date -u +%Y-%m-%d)"
            git push
          fi
